name: quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  architecture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .[dev]
      - run: python tools/assert_ci_final_sha.py
      - run: python -m ruff check song_agent tests tools
      - run: python tools/normalize_v14_domain_exports.py --check
      - run: python tools/repair_v14_domain_imports.py --check
      - run: python tools/normalize_v14_interface_bindings.py --check
      - run: python tools/update_v144_wave0_catalog.py --check
      - run: python -m mypy --no-incremental
      - run: python -m pytest tests/test_architecture_boundaries.py tests/test_architecture_metrics.py tests/test_release_check_governance.py tests/test_release_check_governance_v137.py -q
      - run: python -m song_agent.cli release-check --profile v14 --skip-tests --json

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [unit, contract, integration_partition_0, integration_partition_1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e .[dev]
      - run: python tools/assert_ci_final_sha.py
      - run: python -m pytest -m "${{ matrix.shard }} and not slow and not legacy" -n 2 --dist loadscope -q

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e .[dev]
      - run: python tools/assert_ci_final_sha.py
      - run: python -m pytest -m "not legacy and not slow" -n 4 --dist load --cov=song_agent --cov-report=json:coverage-active.json -q
      - run: python tools/check_coverage_layers.py coverage-active.json --layer active
      - name: Compatibility coverage (soft threshold)
        continue-on-error: true
        run: python -m pytest tests/test_release_check.py::test_status_is_clean_accepts_only_clean_branch_line -m legacy --cov=song_agent --cov-report=json:coverage-compatibility.json -q
      - run: python tools/check_coverage_layers.py coverage-compatibility.json --layer compatibility

  security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e .[dev]
      - run: python tools/assert_ci_final_sha.py
      - run: python -m pytest -m "security and not legacy and not slow" -n 2 --dist loadscope -q
      - run: python -m song_agent.cli release-check --profile security --skip-tests --json

  release-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e .[dev]
      - run: python tools/assert_ci_final_sha.py
      - run: python -m song_agent.cli release-check --profile latest --skip-tests --json
      - run: python -m song_agent.cli release-check --profile ga --skip-tests --json

  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python tools/assert_ci_final_sha.py
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
        shell: bash
      - name: Validate installed wheel outside checkout
        run: >-
          python -c "import os, pathlib, subprocess, sys, tempfile;
          repo = pathlib.Path.cwd().resolve();
          isolated = pathlib.Path(tempfile.mkdtemp(prefix='musicforge-wheel-'));
          os.chdir(isolated);
          import song_agent;
          installed = pathlib.Path(song_agent.__file__).resolve();
          print(installed);
          assert repo / 'song_agent' not in installed.parents;
          subprocess.check_call([sys.executable, '-m', 'song_agent.cli', 'doctor'], cwd=isolated)"

  full-lts:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e .[dev]
      - run: python tools/assert_ci_final_sha.py
      - name: Active suite
        run: python -m pytest -m "not legacy" -n 4 --dist load -q
      - name: Legacy suite
        run: python -m pytest -m "legacy" -n 4 --dist load -q
      - name: Full release-check
        run: python -m song_agent.cli release-check --profile full --skip-tests --json
      - name: v13-rollback-rehearsal
        run: python tools/run_migration_rehearsal.py --output migration-rehearsal.json
      - name: v14-rollback-rehearsal
        run: python tools/run_v14_migration_rehearsal.py --output migration-rehearsal-v14.json

  certification:
    if: always()
    needs: [architecture, tests, coverage, security, release-candidate, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python tools/assert_ci_final_sha.py
      - name: Write final-SHA quality attestation
        env:
          MUSICFORGE_JOB_RESULTS: ${{ toJson(needs) }}
          MUSICFORGE_FINAL_SHA: ${{ github.sha }}
        run: >-
          python -c "import json,os,pathlib,sys;
          rows=json.loads(os.environ['MUSICFORGE_JOB_RESULTS']);
          ok=all(row.get('result')=='success' for row in rows.values());
          payload={'schema_version':1,'status':'passed' if ok else 'failed','sha':os.environ['MUSICFORGE_FINAL_SHA'],'evidence_kind':'github_workflow','workflow':'quality','jobs':{key:row.get('result') for key,row in rows.items()}};
          pathlib.Path('quality.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8');
          sys.exit(0 if ok else 1)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musicforge-quality-attestation-${{ github.sha }}
          path: quality.json
