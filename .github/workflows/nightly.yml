name: nightly-legacy

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

jobs:
  full:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .[dev]
      - run: python -m pytest -m legacy -q
      - run: python -m song_agent.cli release-check --profile nightly --skip-tests --json
