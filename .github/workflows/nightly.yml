name: nightly-legacy

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [legacy_early, legacy_trust, legacy_audio, legacy_program]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e .[dev]
      - run: python -m pytest -m "${{ matrix.shard }}" -n 4 --dist load -q

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e .[dev]
      - run: python -m song_agent.cli release-check --profile nightly --skip-tests --json

  active-slow:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        layer: [unit, contract, integration]
        partition: [0, 1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e .[dev]
      - run: python -m pytest -m "slow and not legacy and ${{ matrix.layer }} and slow_partition_${{ matrix.partition }}" -n 4 --dist load -q
