[project]
name = "song-agent"
version = "13.6.0"
description = "Open songwriting agent that uses LLM APIs and open renderers."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "mypy>=1.11.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-xdist>=3.6.0",
  "ruff>=0.6.0"
]

[project.scripts]
song-agent = "song_agent.cli:main"
song-agent-state = "song_agent.persistence_cli:main"

[tool.setuptools.package-data]
"song_agent.interfaces.web" = ["*.html", "styles/*.css", "scripts/*.js", "scripts/panels/*.js"]

[tool.setuptools.packages.find]
include = ["song_agent*"]
exclude = ["tests*", "material*", "runs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not legacy' -n 4 --dist load"
markers = [
  "unit: deterministic isolated tests",
  "contract: public schema, registry, and compatibility contracts",
  "security: verifier and adversarial package tests",
  "integration: cross-module CLI, API, or workflow tests",
  "integration_partition_0: deterministic first active-integration CI partition",
  "integration_partition_1: deterministic second active-integration CI partition",
  "legacy: archived compatibility behavior",
  "legacy_early: archived v1-v7 release-check smoke",
  "legacy_trust: archived v8-v9 release-check smoke",
  "legacy_audio: archived v10 release-check smoke",
  "legacy_program: archived v11-v12 release-check smoke",
  "slow_partition_0: deterministic first active-slow CI partition",
  "slow_partition_1: deterministic second active-slow CI partition",
  "slow: tests expected to exceed the fast shard budget",
  "platform_windows: Windows-specific filesystem or process behavior"
]

[tool.ruff]
target-version = "py311"
line-length = 140
exclude = ["song_agent/release_check/checks/legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
follow_imports = "skip"
files = [
  "song_agent/platform/contracts",
  "song_agent/platform/evidence_graph",
  "song_agent/platform/lifecycle",
  "song_agent/platform/persistence",
  "song_agent/platform/policy",
  "song_agent/platform/verification",
  "song_agent/application/evidence_policy_gate.py",
  "song_agent/capabilities/registry.py",
  "song_agent/release_check/checks/registry.py"
]
