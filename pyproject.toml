[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "song-agent"
version = "14.3.5"
description = "Open songwriting agent that uses LLM APIs and open renderers."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "mypy>=1.11.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-xdist>=3.6.0",
  "ruff>=0.6.0",
  "setuptools>=69"
]

[project.scripts]
song-agent = "song_agent.cli:main"
song-agent-state = "song_agent.persistence_cli:main"

[tool.setuptools.package-data]
"song_agent.interfaces.web" = ["*.html", "styles/*.css", "scripts/*.js", "scripts/panels/*.js"]
"song_agent.platform.contracts" = ["runtime-package-registry.json", "runtime-package-writer-policy.json"]
"song_agent.platform.persistence" = ["runtime-state-authority-policy.json"]

[tool.setuptools.packages.find]
include = ["song_agent*"]
exclude = ["tests*", "material*", "runs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not legacy' -n auto --dist load"
markers = [
  "unit: deterministic isolated tests",
  "contract: public schema, registry, and compatibility contracts",
  "security: verifier and adversarial package tests",
  "integration: cross-module CLI, API, or workflow tests",
  "integration_partition_0: deterministic first active-integration CI partition",
  "integration_partition_1: deterministic second active-integration CI partition",
  "legacy: archived compatibility behavior",
  "legacy_early: archived v1-v7 release-check smoke",
  "legacy_trust: archived v8-v9 release-check smoke",
  "legacy_audio: archived v10 release-check smoke",
  "legacy_program: archived v11-v12 release-check smoke",
  "slow_partition_0: deterministic first active-slow CI partition",
  "slow_partition_1: deterministic second active-slow CI partition",
  "slow: tests expected to exceed the fast shard budget",
  "platform_windows: Windows-specific filesystem or process behavior"
]

[tool.ruff]
target-version = "py311"
line-length = 140
exclude = ["song_agent/release_check/checks/legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These two modules are static compatibility facades. Their imports are the
# public API, and server.py must install its compatibility patch before the
# route modules are imported.
"song_agent/cli.py" = ["F401"]
"song_agent/server.py" = ["E402", "F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
follow_imports = "skip"
files = [
  "song_agent/platform",
  "song_agent/application",
  "song_agent/domains",
  "song_agent/capabilities",
  "song_agent/interfaces",
  "song_agent/release_check/explicit_any_dataflow.py",
  "song_agent/release_check/v14_wave0.py",
  "song_agent/release_check/v14_wave0_catalog_model.py",
  "song_agent/release_check/v14_wave0_inventory.py",
  "song_agent/release_check/v14_wave0_package_effects.py",
  "song_agent/release_check/v14_wave0_package_inventory.py",
  "song_agent/release_check/v14_wave0_package_registry.py",
  "song_agent/release_check/v14_wave0_package_scan.py",
  "song_agent/release_check/v14_wave0_ratchet.py",
  "song_agent/release_check/v14_wave0_registry.py",
  "song_agent/release_check/v14_wave0_source.py",
  "song_agent/release_check/v14_wave0_state_registry.py",
  "song_agent/release_check/v14_wave0_surfaces.py"
]
